[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trader"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=0.29",
    "torch>=2.3",
    "numpy>=1.26",
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "yfinance>=0.2.40",
    "kaggle>=1.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pydantic>=2.7",
    "typer>=0.12",
    "loguru>=0.7",
    "mlflow>=2.14",
    "tqdm>=4.66",
    "torch-geometric>=2.5",
    "quantstats>=0.0.81",
]

[project.optional-dependencies]
# Live Zerodha data feed (read-only historical bars). Optional on purpose:
# the module lazily imports it and everything else works without it.
#   uv sync --extra zerodha
zerodha = ["kiteconnect>=4.2"]

# Kronos, the open-source K-line foundation model (13_fundamentals_and_news.md
# section 2), evaluated as a pretrained replacement for our from-scratch
# TCNEncoder. Optional because it is a spike: nothing in the shipped pipeline
# imports it, and K1 may kill the whole line.
#
# Deliberately UNPINNED where the upstream repo pins `==`: it wants pandas
# 2.2.2 and we run 2.3.3, and downgrading a core dependency to satisfy an
# experiment is how a spike breaks the thing it was meant to improve. These
# three are the only packages it needs that we do not already have.
#   uv sync --extra kronos
kronos = ["einops>=0.8", "huggingface_hub>=0.33", "safetensors>=0.6"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6",
    "types-requests>=2.31",
]

[project.scripts]
trader = "trader.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.lint.isort]
# Pinned explicitly rather than left to ruff's src-layout inference. The Mac and
# the WSL training box (project on a /mnt/d DrvFs mount) inferred differently
# from byte-identical files with the same ruff 0.15.11: the Mac treated `trader`
# as first-party, WSL as third-party, so `ruff check .` passed on one machine
# and reported 14 I001 errors on the other. Lint results must not depend on
# which filesystem the checkout happens to sit on.
known-first-party = ["trader"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

# NOTE: `[tool.uv] torch-backend` is NOT a field the pinned uv recognises; it made
# every `uv run` print a 20-line TOML parse error ahead of real output, which buried
# the command output this project's verification standard depends on. Removed.

