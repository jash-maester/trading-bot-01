[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trader"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gymnasium>=0.29",
    "torch>=2.3",
    "numpy>=1.26",
    "polars>=1.0",
    "pandas>=2.2",
    "pyarrow>=16",
    "yfinance>=0.2.40",
    "kaggle>=1.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "pydantic>=2.7",
    "typer>=0.12",
    "loguru>=0.7",
    "mlflow>=2.14",
    "tqdm>=4.66",
    "torch-geometric>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "hypothesis>=6",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6",
]

[project.scripts]
trader = "trader.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/trader"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.uv]
torch-backend = "auto"
