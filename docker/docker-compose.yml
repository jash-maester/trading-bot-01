# Compose derives the project name from the directory it sits in, which made
# every container "docker-*" and every volume "docker_*" — indistinguishable
# from any other project on a shared machine. Named explicitly instead.
name: trading-bot

services:
  postgres:
    image: postgres:16-alpine
    # Survive Docker Desktop restarts and Mac reboots: the forward paper loop
    # and MLflow logging assume these are up, and on 2026-09-25 a missing
    # MLflow server failed the loop's allocator stage.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader}
      POSTGRES_DB: ${POSTGRES_DB:-trader}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader} -d ${POSTGRES_DB:-trader}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mlflow:
    restart: unless-stopped
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    ports:
      - "${MLFLOW_PORT:-5555}:5000"
    volumes:
      - mlruns:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - pgadmin

volumes:
  pgdata:
  mlruns:
