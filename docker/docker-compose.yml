# Compose derives the project name from the directory it sits in, which made
# every container "docker-*" and every volume "docker_*" — indistinguishable
# from any other project on a shared machine. Named explicitly instead.
name: trading-bot

services:
  postgres:
    image: postgres:16-alpine
    # Survive Docker Desktop restarts and Mac reboots: the forward paper loop
    # and MLflow logging assume these are up, and on 2026-09-25 a missing
    # MLflow server failed the loop's allocator stage.
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trader}
      POSTGRES_DB: ${POSTGRES_DB:-trader}
    # Localhost only: default credentials (trader/trader) were reachable from
    # the whole LAN. Containers use the compose network, not these ports.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trader} -d ${POSTGRES_DB:-trader}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mlflow:
    restart: unless-stopped
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5555}:5000"
    volumes:
      - mlruns:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  paper:
    # audit/P2 forward paper loop on a container schedule. Replaces macOS cron,
    # which TCC blocks from the USB volume the repo lives on.
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/paper.Dockerfile
    environment:
      TRADER_MLFLOW_URI: http://mlflow:5000
    volumes:
      - ..:/app
    depends_on:
      mlflow:
        condition: service_healthy
    profiles:
      - paper

  dashboard:
    # Read-only monitor of the audit/P2 forward paper test: http://localhost:8501
    # No profile: it starts with the stack. It never talks to Kite and places
    # no orders; it reads files the paper loop writes.
    #
    # Mounts: the whole repo READ-ONLY at /app -- so a bug in the page cannot
    # touch audit/paper/record.jsonl (append-only record of truth), snapshots or
    # data/. The single writable path is logs/dashboard, where the on-demand
    # "re-run health check" button writes its health.json (PAPER_HEALTH_OUT)
    # plus its probe_stamp / probe.lock rate-limit files; the page merges that
    # report with the host's audit/paper/health.json per check. The check itself
    # needs scripts/, src/ and data/ -- readable via /app.
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/dashboard.Dockerfile
    # Loopback only: no auth, and the page can trigger NSE probes. To view from
    # another device on the LAN, export DASHBOARD_BIND=0.0.0.0 before `up`.
    ports:
      - "${DASHBOARD_BIND:-127.0.0.1}:8501:8501"
    environment:
      DASHBOARD_HEALTH_OUT: logs/dashboard/health.json
    volumes:
      - ..:/app:ro
      - ../logs/dashboard:/app/logs/dashboard
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8501/_stcore/health').read().strip()==b'ok' else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - pgadmin

volumes:
  pgdata:
  mlruns:
