# @package _global_.walk
# Walk-forward training defaults.
# Override at the command line, e.g.:
#   python scripts/walk_forward.py walk.seeds=[42,43,44,45,46]
n_windows: 4
train_years: 5
val_months: 12
test_months: 12

# Gap cut between train/val and val/test so that no rolling feature window spans
# a boundary.  This was 1 month: 17-23 NSE trading days (measured over
# data/kite_ohlcv, 2014-2026) against 60-day features (realized_vol_60d,
# beta_nifty_60d), leaving ~40 contaminated rows on each of the 8 boundaries.
# 3 months is the shortest gap that clears 60 trading days; 4 gives margin (the
# worst 3-month span in the last decade, Feb-Apr 2014, is only 58 trading days).
# compute_windows() raises below the longest lookback in
# trader.data.features.FEATURE_LOOKBACK_DAYS, so this cannot regress silently.
purge_months: 3
step_months: 12
seeds: [42, 43, 44]

# Escape hatch for the panel-contiguity check in scripts/walk_forward.py.  The
# driver refuses to slice windows out of a panel whose calendar has holes — the
# concat(train, val, test) fallback has one where each build-time purge month was
# dropped, which truncated 4 of 12 segments on data/panels.  Setting this to true
# runs anyway and the results are wrong; it exists only to inspect an old panel.
allow_panel_gaps: false

# Shuffled-ticker-label leak check (M7 acceptance).  When true, each window is
# additionally evaluated with the ticker axis of `features`/`sector_ids`
# permuted, so per-stock features no longer correspond to the stock whose
# returns are realised.  Expect the shuffled arm to land near equal-weight —
# long-only beta survives relabelling — NOT at zero.  Red flags: shuffled
# ~= real (the model is not using per-stock information), or shuffled well
# above equal-weight (a leak).  Off by default: it costs an extra eval pass.
shuffle_check: false
