# @package _global_.env
#
# AllocatorEnv (R6) — one step is one REBALANCE PERIOD, not one day.
# `10_architecture_revamp.md` §5, "RL, IF IT RETURNS".
#
# This config configures BOTH layers:
#   `inner:`     the PanelTradingEnv this env drives day by day
#   everything else: the period-level MDP (AllocatorEnvConfig / ActionRanges)
#
# Nothing here is a measured value.  No walk-forward has been run against this
# env; every number below is a starting point, and per CLAUDE.md rule 2 none of
# them may be described as a winner until an MLflow run id says so.

# ── inner PanelTradingEnv ────────────────────────────────────────────────────
inner:
  lookback_days: 60
  initial_cash: 1_000_000
  transaction_cost_model: zerodha_equity_delivery
  reward: log_return
  # REQUIRED true.  AllocatorEnv sums the inner env's daily rewards and calls
  # the sum "the period's excess log return"; with raw log return the agent is
  # paid for being long in a 16.4%/yr market (§1.3) and AllocatorEnv refuses to
  # construct (InnerEnvMisconfigured).
  use_excess_returns: true
  # REQUIRED 0.0.  The turnover charge is applied ONCE, per period, by
  # `turnover_penalty` below.  A non-zero value here charges it twice at two
  # different scales; AllocatorEnv refuses to construct.
  turnover_penalty: 0.0
  # Rebalance cadence.  Monthly is the §4 recommendation: delivery STT is 0.1%
  # on both legs and STCG is 20% under twelve months, so daily rebalancing was
  # "the single most expensive choice in the system and it was never justified"
  # (§7).  Ablations: weekly, daily.
  rebalance_freq: monthly      # daily | weekly | monthly
  rebalance_anchor: first      # first | last trading day of the period
  # Long enough to contain periods_per_episode months plus slack.  The env
  # clamps this down automatically on a short val/test panel.
  episode_length: 756

# ── period-level MDP ─────────────────────────────────────────────────────────
periods_per_episode: 24        # §5 specifies 12-36; 24 monthly steps = 2 years
max_days_per_period: 45        # safety stop if a schedule yields no next rebalance day
max_name_weight: 0.10          # matches the env's own per-name cap
max_sector_weight: 0.25

# ── per-name no-trade band (P3) ──────────────────────────────────────────────
# `AllocatorParams.no_trade_band` (src/trader/allocator/deterministic.py): a
# name is only traded when |target - current| exceeds it, so the long tail of
# tiny rebalances produces no order at all.  `turnover_budget` constrains gross
# RUPEES; the demat debit is a flat ₹15.34 per distinct scrip per selling day
# (costs.py:55) and is 83-98% of all cost measured, so the number of names sold
# is the quantity that has to be constrained.
#
# Measured on synthetic books (N=504, K=30, budget 0.30, AR(1) rho=0.90; run
# `uv run pytest -s -q tests/unit/test_allocator.py -k band_cuts_name_count`).
# QUOTE THE `billed` COLUMNS.  The count that costs money is the sells the env
# actually executes, i.e. those clearing `min_trade_value` (Rs 500, costs.py);
# about two thirds of the band-0 weight-space sell tail is below it and was
# never going to be billed.  Against that baseline a 0.005 band leaves:
#
#   band    billed sells/rebalance   % of band-0   gross turnover %
#   0.000   50.78 (10L) 83.29 (1Cr)     100 / 100        100.0
#   0.002   24.66       24.66            48.6 / 29.6      92.4
#   0.005   10.16       10.16            20.0 / 12.2      69.6
#   0.010    4.83        4.83             9.5 /  5.8      56.7
#
# The earlier version of this comment said "6.5% of the unbanded count" at
# 0.005; that was against the weight-space `sold` column and overstated the
# band by ~3x.  Flat-fee drag at band 0 is 0.93% of NAV/yr on a Rs 10 lakh book,
# not 2.86%.
#
# TWO LIMITS, both measured, before this is set on a real run:
#  * the counts above are weight-space suppressions.  A pinned name can still
#    produce an order in the env when an overnight gap moves its weight by more
#    than half a share (`tests/unit/test_weight_to_share_orders.py`), so
#    n_suppressed is an upper bound and a loose one at large capital.
#  * nothing here is measured on the real panel: the R5 grid is serialised
#    behind the other streams and has not been re-run, so per CLAUDE.md rules 2
#    and 3 no value here is a recommendation yet.
#
# The key IS live: `scripts/train_allocator_rl.py` reads it,
# `AllocatorEnvConfig.no_trade_band` holds it and `ActionRanges.decode` passes
# it into `AllocatorParams`.  0.0 keeps the pre-band code path exactly.
# For the deterministic grid use `+allocator.no_trade_band=` or
# `+allocator.band_grid=[...]` on `scripts/run_allocator.py`.
no_trade_band: 0.0
# Load-bearing: names the panel vol column as realized_vol_{vol_lookback}d
# (allocator_env.vol_column_for). There is deliberately no separate
# `vol_column` key -- two keys for one thing silently disagree.
vol_lookback: 20

# Reward penalties, on top of the summed daily EXCESS log return.
# BOTH ARE UNCALIBRATED — §8 says the right turnover_penalty "needs a run, not
# a guess", and that was written about the *daily* env.  0.02 charges 2 bp of
# reward per 1% of gross turnover, the same order as the verified delivery
# round-trip cost the inner env already subtracts from NAV, so it acts as a
# mild extra brake rather than a second full charge.
turnover_penalty: 0.02
drawdown_penalty: 1.0
drawdown_threshold: 0.10       # no penalty until the book is 10% off its peak

# ── action ranges ────────────────────────────────────────────────────────────
# The policy samples a ∈ [0,1]^A with A = 3 + n_sectors = 17 (14 sectors).
# Each entry below is the affine image of one unit interval.  Justification for
# every bound is in ActionRanges' docstring (src/trader/env/allocator_env.py).
ranges:
  k_min: 10                    # below ~10 a 10% name cap cannot place the book
  k_max: 60                    # above ~60 the book is equal-weight, i.e. the baseline
  turnover_min: 0.05           # 0 would freeze the book and starve the tilt gradient
  turnover_max: 1.0            # gross two-sided; 1.0 = one full side, 2.0 = full rotation
  cash_floor_min: 0.0
  cash_floor_max: 0.5          # beyond half cash it is not an equity selection strategy
  tilt_min: -1.0               # r_hat *= (1 + tilt) → factor in [0, 2]
  tilt_max: 1.0
  n_sectors: 14                # len(SECTOR_IDS); ids are 1-indexed, 0 = unsectored

# ── signal artefact ──────────────────────────────────────────────────────────
# R4's OOS predictions.  `scripts/train_allocator_rl.py` REFUSES to run unless
# <signal_dir>/gate.json exists and says PASS (CLAUDE.md rule 1, in code).
signal_dir: null               # e.g. data/signal/r4_baseline
signal_horizon: r_hat_20d      # monthly rebalancing reads the 20d head

# ── risk overlays (risk.py) ──────────────────────────────────────────────────
# The standing comparison set. Every allocator run reports all three arms so a
# result is never quoted without its risk-controlled counterparts beside it.
#
# Measured twice, in sample 2016-24 and on the unseen 2025-26 holdout, and the
# ORDERING held both times: a tighter stop buys Sharpe and drawdown with return,
# monotonically. Holdout at Rs 1 lakh after tax and all charges:
#   none      Sharpe 1.720  CAGR 0.304  MDD -0.133
#   stop 15%  Sharpe 2.013  CAGR 0.251  MDD -0.087
#   stop 10%  Sharpe 2.093  CAGR 0.222  MDD -0.080
# 10% is the chosen default: shallowest drawdown, best Sharpe, and the
# conservative end of a monotone tradeoff.
#
# The stop measures loss from the FILL price, not from the entry day's close,
# and not from any dip below the purchase price -- a 0% threshold would sell
# roughly half the book on noise and pay a flat Rs 15.34 each time.
risk_grid:
  - name: none
  - name: stop10
    stop_loss: 0.10
    stop_cooldown_steps: 21
  - name: stop15
    stop_loss: 0.15
    stop_cooldown_steps: 21
