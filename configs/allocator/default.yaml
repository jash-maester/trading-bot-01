# @package _global_.allocator
#
# Standing configuration for the deterministic allocator and its risk overlays.
#
# This group did not exist before 2026-09-07: `run_allocator.py` read
# `cfg.allocator` and nothing ever populated it, so every knob came from a
# `+allocator.x=` command-line override and no default was version-controlled.
# That is the `min_trade_value: 500` trap in a different costume — a key the
# code reads that no file sets.

k_grid: [20, 30, 40]
freq_grid: [monthly, weekly, daily]
horizon_grid: ["5d", "20d"]
band_grid: [0.0]
null_control: true

max_name_weight: 0.10
max_sector_weight: 0.25
turnover_budget: 0.30
cash_floor: 0.0
vol_lookback: 20
# 0.0 is the historical default and is NOT the value any evidence supports.
# The 0.010 band is the single most replicated result in this project: best of
# {0.0, 0.005, 0.010} in all EIGHT span x K x cadence cells tested, in sample
# and on the holdout, with a measured mechanism -- scrips sold per rebalance
# 77.8 -> 8.1 and tax drag 1.9pp -> 0.6pp, below equal-weight's own 0.7pp.
# audit/S2_ALLOCATOR_ON_PIT.md section 3, audit/R5_VERDICT_PIT.md section 2.
# Left at 0.0 only so historical runs reproduce; new work should set 0.010.
no_trade_band: 0.0

# ── risk overlays (trader/allocator/risk.py) ─────────────────────────────────
# The standing comparison set: every run reports all of these, so a result is
# never quoted without its risk-controlled counterparts beside it.
#
# WARNING — every absolute number in this comment block was measured on the
# FIXED 504-name universe, which came from a 2026 instrument dump and is
# survivorship-selected. audit/S1_SURVIVORSHIP.md: on a point-in-time universe
# momentum-top-K falls from CAGR +0.273 to -0.002 and equal-weight from 0.257 to
# 0.119. Treat the CAGR and Sharpe levels below as INVALID; roughly 12 points of
# them were the universe. The ORDERING is what survived re-measurement and is
# the only reason these tables are kept.
#
# Measured twice — in sample 2016-24 and on the then-unseen 2025-26 holdout —
# and the ordering held both times: a tighter stop buys Sharpe and drawdown with
# return, monotonically. Holdout at Rs 1 lakh, after tax and every Zerodha
# charge, ON THE FIXED UNIVERSE:
#     none      Sharpe 1.720  CAGR 0.304  MDD -0.133
#     stop 15%  Sharpe 2.013  CAGR 0.251  MDD -0.087
#     stop 10%  Sharpe 2.093  CAGR 0.222  MDD -0.080
#
# The stop measures loss from the FILL price, not the entry day's close, and not
# from any dip below the purchase price: a 0% threshold would sell roughly half
# the book on ordinary noise and pay a flat Rs 15.34 every time.
#
# `vol_mult` arms scale the threshold by each NAME's own volatility instead of
# applying one number to a utility and a small-cap alike. See
# `RiskParams.stop_vol_mult`.
# Swept on the then-unseen holdout at Rs 1 lakh, after tax and every charge
# (audit/r4_v2/stop_sweep.log) — again on the FIXED universe, so read the
# ordering and not the levels. The fixed arms are monotone in the threshold —
# tighter buys Sharpe and drawdown with return — and the volatility-scaled arm
# sits off that line, which is the point of it:
#     none     Sharpe 1.720  CAGR 0.304  MDD -0.133
#     fx 5%    Sharpe 2.598  CAGR 0.229  MDD -0.052
#     fx 10%   Sharpe 2.207  CAGR 0.245  MDD -0.074
#     fx 15%   Sharpe 2.040  CAGR 0.260  MDD -0.084
#     fx 20%   Sharpe 1.964  CAGR 0.280  MDD -0.102
#     vol 1.0  Sharpe 2.428  CAGR 0.267  MDD -0.071   <- dominates fx 10%
# vol100 returns MORE than the 10% fixed stop on a SHALLOWER drawdown, because
# it stops a calm name early and gives a volatile one room instead of applying
# one number to both.
risk_grid:
  - name: none
  - name: stop10
    stop_loss: 0.10
    stop_cooldown_steps: 21
  - name: stop15
    stop_loss: 0.15
    stop_cooldown_steps: 21
  - name: volstop
    stop_vol_mult: 1.0
    stop_vol_horizon_days: 20
    stop_cooldown_steps: 21
