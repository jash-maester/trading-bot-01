defaults:
  - data: default
  - env: panel_daily
  # Default is mlp_regime (TCN + CrossStockAttention + regime FiLM + critic
  # concat).  NOTE: this is the *intended* architecture, NOT a measured
  # winner — as of 2026-09-04 no walk-forward has been run on it.  See
  # HANDOFF.md §6 for the A/B that has to happen before anyone calls it one.
  # Override with `model=mlp_baseline` for the pre-Phase-1 control, or
  # `model=mlp_regime_aux` (with `train=ppo_aux`) for the Phase 2
  # auxiliary-head variant.
  - model: mlp_regime
  - train: ppo_baseline
  - allocator: default
  - broker: paper
  - walk: default
  - _self_

seed: 42

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
