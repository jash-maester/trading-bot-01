# @package _global_.model
# Full heterogeneous GNN: intra-sector + membership + inter-sector edges.
# Ablation: compare against mlp_baseline (no graph) and gnn_intra_only.
name: gnn_v1
encoder: tcn
tcn:
  num_channels: [64, 64, 64, 64]   # 4 blocks, dilations 1/2/4/8 → out_dim = 64
  kernel_size: 3
  dropout: 0.1
embed_dim: 64                       # fallback only; TCN uses num_channels above
use_graph: true
graph:
  # num_sectors: intentionally unset. GNNConfig derives it from SECTOR_IDS in
  # universe.py at construction time, so it tracks the universe. Pinning it to
  # a literal (it said 8) silently under-sized the sector embedding the moment
  # SECTOR_IDS grew. Set it only to deliberately override that width.
  hidden_dim: 64                    # overridden to encoder.out_dim at runtime
  num_heads: 2
  dropout: 0.1
  drop_edge_prob: 0.1
  layers: 2
  relations: all
# Regime conditioning is not wired into the GNN model — these are no-ops
# here, listed only so generic Hydra overrides don't fail.
regime_film_encoder: false
regime_film_attn: false
regime_in_critic: false
use_aux_return_head: false
aux_return_hidden: 32
compile: false
