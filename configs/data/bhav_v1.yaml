# @package _global_.data
# NSE full-market bhavcopy, 2010 → today, for the POINT-IN-TIME universe rebuild.
#
# A sibling of kite_v1, not a replacement. It writes to data/bhav_ohlcv and
# data/panels_bhav so the validated Kite panels survive untouched and the two can
# be compared — which is the entire experiment: how much of the measured edge is
# a universe chosen in 2026?
#
# Measured 2026-09-08: of the 605 names carrying >= Rs 5 crore of median daily
# turnover in 2021, the 504-name Kite universe contains 292 — 48.3% — and 55 of
# those 605 had stopped trading by 2026.
#
# Prices here are back-adjusted from NSE's own `prev_close`
# (`nse_bhavcopy.back_adjust`), which catches splits, bonuses AND demergers. Kite
# bars are adjusted for splits and bonuses but not dividends, and `auto_adjust`
# does not handle demergers at all — so this store is, if anything, cleaner on
# corporate actions than the one it is being compared against.

start_date: "2010-01-01"
end_date: "2026-09-05"

# The universe is taken FROM the store rather than from SECTOR_MAP: that is the
# point. Sector ids come from NSE's published classification, because
# `sector_id_of` returns 0 outside the 504 curated names and 0 is the phantom
# sector in CLAUDE.md.
universe_source: store
industry_file: data/ext/industries.parquet

parquet_root: data/bhav_ohlcv
panels_root: data/panels_bhav
raw_cache: data/raw/nse/bhavcopy
