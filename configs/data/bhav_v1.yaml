# @package _global_.data
# NSE full-market bhavcopy, 2010 → today, for the POINT-IN-TIME universe rebuild.
#
# A sibling of kite_v1, not a replacement. It writes to data/bhav_ohlcv and
# data/panels_bhav so the validated Kite panels survive untouched and the two can
# be compared — which is the entire experiment: how much of the measured edge is
# a universe chosen in 2026?
#
# Measured 2026-09-08: of the 605 names carrying >= Rs 5 crore of median daily
# turnover in 2021, the 504-name Kite universe contains 292 — 48.3% — and 55 of
# those 605 had stopped trading by 2026.
#
# Prices here are back-adjusted from NSE's own `prev_close`
# (`nse_bhavcopy.back_adjust`), which catches splits, bonuses AND demergers. Kite
# bars are adjusted for splits and bonuses but not dividends, and `auto_adjust`
# does not handle demergers at all — so this store is, if anything, cleaner on
# corporate actions than the one it is being compared against.

start_date: "2010-01-01"
end_date: "2026-09-05"

# The universe is taken FROM the store rather than from SECTOR_MAP: that is the
# point. Sector ids come from NSE's published classification, because
# `sector_id_of` returns 0 outside the 504 curated names and 0 is the phantom
# sector in CLAUDE.md.
universe_source: store
industry_file: data/ext/industries.parquet

parquet_root: data/bhav_ohlcv
panels_root: data/panels_bhav
raw_cache: data/raw/nse/bhavcopy

# The third tradeability belt. align_panel handles listing spans and
# compute_features handles feature warm-up; neither asks whether a name was
# worth trading. Without this the panel is still a fixed universe.
#
# max_names holds the width constant so the rebuilt panel is directly
# comparable with the fixed 504 and so the action space does not grow past what
# an 8 GiB card fits.
pit_universe:
  min_median_turnover: 5.0e7    # Rs 5 crore median daily turnover
  lookback_days: 365
  min_sessions: 100
  min_price: 5.0
  max_names: 504

# MEASURED 2026-09-08, against data/ext/delivery.parquet (2020-07..2026-09):
#
#   top-504 cap   per month exactly 504   union over 5.2 yrs   944 names
#   uncapped      per month 523..1022     union over 5.2 yrs 1,426 names
#
# Monthly churn is 2.31% at the cap, so the union over the full 2016-2024
# walk-forward extrapolates to roughly 1,185 columns. The cap binds every
# single month, which means there are always at least 504 names clearing the
# turnover floor and the width really is constant.
#
# CONSEQUENCE FOR TRAINING. The PANEL carries the union (~1,185 columns), which
# is cheap on disk. The MODEL must not: 1,185 names is 2.35x the 504/L=30/mb=64
# configuration measured against the 8 GiB card, and cost scales linearly in
# ticker count. So a walk-forward window has to fix its universe at the start
# of its test span -- chosen from data strictly before it -- and hold those 504
# for the window. That is a genuine point-in-time decision taken once a year,
# which is how an index reconstitutes; it is not lookahead, and it keeps the
# action space at exactly 504.
#
# The baselines and the allocator do NOT train and can read the full panel, so
# Phase 1 needs none of this.
