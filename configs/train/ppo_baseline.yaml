# @package _global_.train
total_steps: 8_000_000
n_envs: 16
n_steps: 256
n_minibatches: 32
n_epochs: 4
learning_rate: 3.0e-4
gamma: 0.995
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0001       # r7: lowered from 0.001 — entropy crept σ from 0.37 → 0.68 by end of r6
vf_coef: 0.5
max_grad_norm: 0.5
anneal_lr: true
normalize_rewards: true  # RunningMeanStd reward scaling before GAE
log_interval: 10
eval_interval: 50
checkpoint_interval: 200
# Phase 2 — auxiliary next-day return-prediction loss weight.  Active only
# when the model also has `use_aux_return_head: true` (see configs/model/).
# 0.0 here = backwards-compatible default; the path is dead unless both
# flags are set.
aux_return_loss_coef: 0.0
