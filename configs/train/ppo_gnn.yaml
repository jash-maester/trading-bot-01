# @package _global_.train
# GNN variant — higher step budget to allow graph attention to converge.
total_steps: 10_000_000
n_envs: 16
n_steps: 256
n_minibatches: 32
n_epochs: 4
learning_rate: 3.0e-4
gamma: 0.995
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.001        # reduced from 0.01 — entropy was dominating pg signal
vf_coef: 0.5
max_grad_norm: 0.5
anneal_lr: true
normalize_rewards: true  # RunningMeanStd reward scaling before GAE
log_interval: 10
eval_interval: 50
checkpoint_interval: 200
