# @package _global_.train
# GNN variant — higher step budget to allow graph attention to converge.
total_steps: 10_000_000
n_envs: 16
n_steps: 256
n_minibatches: 32      # same as MLP baseline; eval() mode already fixes GNN stability
n_epochs: 4
learning_rate: 5.0e-5  # reduced from 3e-4 — GNN attention layers have larger grads
gamma: 0.995
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0001       # r7: lowered from 0.001 — entropy crept σ from 0.37 → 0.68 by end of r6
vf_coef: 0.5
max_grad_norm: 0.2     # tighter than MLP (0.5) — GNN grad norms are much larger
anneal_lr: true
normalize_rewards: true  # RunningMeanStd reward scaling before GAE
log_interval: 10
eval_interval: 50
checkpoint_interval: 200
# GNN models don't currently expose the aux head; flag listed for Hydra
# override compatibility only.
aux_return_loss_coef: 0.0
