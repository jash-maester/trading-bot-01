# @package _global_.train
#
# PPO baseline + auxiliary return-prediction loss enabled.
# Use with model=mlp_regime_aux:
#   uv run python scripts/walk_forward.py model=mlp_regime_aux train=ppo_aux
total_steps: 8_000_000
n_envs: 16
n_steps: 256
n_minibatches: 32
n_epochs: 4
learning_rate: 3.0e-4
gamma: 0.995
gae_lambda: 0.95
clip_coef: 0.2
ent_coef: 0.0001
vf_coef: 0.5
max_grad_norm: 0.5
anneal_lr: true
normalize_rewards: true
log_interval: 10
eval_interval: 50
checkpoint_interval: 200
# 0.1 chosen so that aux_loss × 0.1 is comparable in magnitude to
# (pg_loss + vf_coef · vf_loss) early in training but doesn't dominate.
# Natural ablation sweep: {0.05, 0.1, 0.2}.
aux_return_loss_coef: 0.1
